# Paths are relative to this file (methods/orbslam3/); repo root = ../..
services:
  orbslam3:
    build:
      context: .
      dockerfile: Dockerfile
    image: vio-bench/orbslam3:4452a3c
    platform: linux/arm64
    volumes:
      - ../../data:/workspace/data:ro
      - ../../results:/workspace/results
      - ./config:/workspace/config:ro
      - ./run.sh:/usr/local/bin/run_orbslam3:ro   # edits need no rebuild
    working_dir: /workspace
    # usage: docker compose run --rm orbslam3 <dataset> <seq> <mode> <settings.yaml> [--runs N] [--loop-closing] [--max-frames N]
