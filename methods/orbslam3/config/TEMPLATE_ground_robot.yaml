%YAML:1.0
# =============================================================================
# ORB-SLAM3 v1.0 settings TEMPLATE for a ground-robot dataset (values = EuRoC placeholders!)
# Every line marked "CHANGE" must be set from the dataset's calibration.
# run.sh appends `loopClosing: 0|1` (default 0), so do not set it here.
# =============================================================================
File.version: "1.0"

# --- Camera model (CHANGE) ---------------------------------------------------
# "PinHole"      : params fx fy cx cy + (k1 k2 p1 p2 [k3]) radtan distortion (OpenCV)
# "KannalaBrandt8": equidistant/fisheye, params fx fy cx cy + k1 k2 k3 k4  (use for fisheye lenses)
# Other models (equidistant "ds", omni, ...) are NOT supported: undistort/convert beforehand.
Camera.type: "PinHole"

Camera1.fx: 458.654
Camera1.fy: 457.296
Camera1.cx: 367.215
Camera1.cy: 248.375
Camera1.k1: -0.28340811
Camera1.k2: 0.07395907
Camera1.p1: 0.00019359
Camera1.p2: 1.76187114e-05
# (if k3 present for PinHole: Camera1.k3)
# For KannalaBrandt8 replace distortion by: Camera1.k1 .. Camera1.k4  (no p1/p2)

# Stereo only (right camera, same model/params with the Camera2.* prefix) (CHANGE or delete):
Camera2.fx: 457.587
Camera2.fy: 456.134
Camera2.cx: 379.999
Camera2.cy: 255.238
Camera2.k1: -0.28368365
Camera2.k2: 0.07451284
Camera2.p1: -0.00010473
Camera2.p2: -3.55590700e-05

Camera.width: 752          # CHANGE
Camera.height: 480         # CHANGE
# Optional internal resize (speed). Remove both lines to disable.
Camera.newWidth: 600
Camera.newHeight: 350
Camera.fps: 20             # CHANGE (camera frame rate)
Camera.RGB: 1              # ignored for grayscale images

# Stereo: baseline*fx, and depth threshold (close points = depth < ThDepth * baseline)
Stereo.ThDepth: 60.0
# Stereo: T_c1_c2 (cam1 -> cam2), 4x4 (CHANGE). Needed for stereo_inertial.
Stereo.T_c1_c2: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [0.999997256477881, 0.002312067192424, 0.000376008102415, -0.110073808127187,
         -0.002317135723281, 0.999898048506644, 0.014089835846648, 0.000399121547014,
         -0.000343393120525, -0.014090668452714, 0.999900662637729, -0.000853702503357,
         0, 0, 0, 1.000000000000000]

# --- IMU (CHANGE) ------------------------------------------------------------
# IMU.T_b_c1 : transform that maps a point in cam1 (left) frame to the IMU/body frame (T_body<-cam).
# If the dataset gives T_cam_imu (Kalibr "T_cam_imu"), INVERT it. Output poses are in this body frame,
# so for a ground robot with a wheel-odom/base frame as GT, the GT must be expressed in the same IMU frame
# (or be aligned using SE(3) alignment of trajectories in the same body frame).
IMU.T_b_c1: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [0.0148655429818, -0.999880929698, 0.00414029679422, -0.0216401454975,
         0.999557249008, 0.0149672133247, 0.025715529948, -0.064676986768,
         -0.0257744366974, 0.00375618835797, 0.999660727178, 0.00981073058949,
         0.0, 0.0, 0.0, 1.0]
# Noise densities in continuous time units: gyro rad/s/sqrt(Hz), acc m/s^2/sqrt(Hz); walks: rad/s^2/sqrt(Hz), m/s^3/sqrt(Hz)
# ORB-SLAM3 uses the sample-rate sqrt scaling internally (IMU.Frequency). Take Kalibr/datasheet values,
# and inflate x2..x10 for cheap MEMS IMUs (robustness > "correct" values).
IMU.NoiseGyro: 1.7e-4      # CHANGE
IMU.NoiseAcc: 2.0e-3       # CHANGE
IMU.GyroWalk: 1.9393e-05   # CHANGE
IMU.AccWalk: 3.0e-03       # CHANGE
IMU.Frequency: 200.0       # CHANGE (Hz). Must match actual rate; also ORB-SLAM3 assumes gravity-aligned accel in m/s^2 (not g!).

# --- ORB (more features for low-texture / larger images) ---------------------
ORBextractor.nFeatures: 1000   # try 1200-2000 for outdoor / low-texture ground scenes
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20     # lower (e.g. 12) for low contrast
ORBextractor.minThFAST: 7

# Viewer params are required by the parser even when headless
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0

# =============================================================================
# NOTES for ground-robot data
#  * Image timestamps and IMU timestamps must share one clock; the example loader requires the first IMU
#    sample to precede the first image (loops `while imu_t <= cam_t[0]`).
#  * Planar / constant-velocity motion = poor IMU excitation: scale and accelerometer bias become weakly
#    observable. ORB-SLAM3's IMU initialization (~2 s then BA at ~5 s and ~15 s) can fail ("not enough
#    acceleration"/ scale never converges, map resets: "Fail to track local map!", "IMU is not or recently
#    initialized. Reseting active map"). Mitigations: start the sequence with a few seconds of rotation/
#    acceleration (figure-8, stop-and-go), use stereo_inertial (metric scale from baseline, much more
#    robust than mono_inertial), inflate IMU noise, verify T_b_c1 and the IMU unit/axes first.
#  * After a reset ORB-SLAM3 starts a NEW map; SaveTrajectoryEuRoC writes only the map with most KFs, so the
#    trajectory may cover only part of the run. Check traj_tum.txt time span vs. GT.
#  * Wheel/vehicle vibration inflates accel noise -> raise IMU.NoiseAcc; slow motion with low parallax makes
#    monocular init slow.
# =============================================================================
